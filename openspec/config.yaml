schema: spec-driven

# Project context — constraints for every OpenSpec artifact and workflow.
context: |
  Backend: CRM Developer API (NestJS 11, TypeScript), multi-tenant SaaS CRM for real-estate developers.
  ARCHITECTURE.md at the project root is the binding architecture. Read it before writing design or tasks.

  The frontend (../crm-developer-ui, Next.js) already exists and must work unchanged except where a change
  explicitly says the UI changes. Its HTTP contract is ../crm-developer-ui/memory-bank/api-contract-v1.md and its
  MSW handlers (../crm-developer-ui/src/mocks/) show exact request/response behaviour. The backend must serve
  that contract. rbac.md at the project root is the input spec for user management and access control.

  Hard constraints:
  - DDD + CQRS (@nestjs/cqrs) + Vertical Slice: one module per aggregate under src/application/modules/<entity>/,
    one folder per use case under features/<featurename>/.
  - Layers: api (thin controllers, CommandBus/QueryBus only) -> application (handlers) -> domain (aggregates)
    -> infrastructure (Repository = write side, Queries = read side, injected by Symbol token).
  - PostgreSQL via Sequelize (sequelize-typescript). snake_case tables and columns, UUID v7 primary keys,
    timestamptz created_at/updated_at. Schema changes only through SQL migrations in migrations/; seed data in seeds/.
  - Multi-tenant: every tenant-owned row has organization_id; every tenant query filters by the caller's organization.
  - HTTP: prefix /api/v1, port 3000. Success { success: true, data, meta? }; error
    { success: false, error: { code, message, details? } }. Validation failures are 422 VALIDATION_FAILED listing every
    bad field. Lists use page/pageSize (default 20, max 100) and meta { page, pageSize, total }.
  - Auth: JWT access token (short-lived) + opaque rotating refresh token stored hashed in user_sessions.
    Backend enforces every permission; the UI only reflects it.
  - Keep code as simple as possible (the simple-code skill); add libraries only when the change justifies them.

rules:
  proposal:
    - Name which frontend screens or contract sections the change serves.
  design:
    - Map the change onto the layers and folders in ARCHITECTURE.md; name every new file with its full path.
    - List each new table with columns, types, nullability, constraints, indexes and FKs, and the migration file name.
    - Separate write-side (repository) and read-side (queries) methods explicitly.
    - State every response shape and error code the frontend contract expects.
  tasks:
    - Order tasks by layer (migration -> domain -> infrastructure -> application slices -> api -> tests -> verify).
    - One task per vertical slice, naming its Command or Query, Handler, Request and Response files.
    - Include registration tasks (module wiring, ApiModule, seeds, permission catalogue where relevant).
    - Include test tasks per ARCHITECTURE.md section 17.3 and a final pre-flight task (section 18.4) with the scorecard (section 19.5).
  specs:
    - Write requirements as API behaviour (endpoint, input, response, error codes), not implementation details.

operations:
  apply:
    guidance:
      - Follow ARCHITECTURE.md templates and naming exactly and copy patterns from it rather than inventing new ones.
      - Use path aliases across layers and relative imports only inside a slice.
      - Follow coding practices (section 15) and hard rules (section 16.1) and run npm run check:boundaries before finishing.
      - Write tests alongside each slice per section 17 and never mock aggregates or Guards.
      - Follow the simple-code skill in .claude/skills/simple-code so the code is the simplest that fits the templates.
